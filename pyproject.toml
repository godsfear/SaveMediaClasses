[project]
name = "SaveMedia"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    # CLI, Flutter shell и Python runtime обязаны быть одной версии: flet build
    # разрешает runtime-зависимости отдельно и при диапазоне может упаковать
    # более новый, протокольно несовместимый Python-пакет.
    "flet==0.86.5",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "flet-cli==0.86.5",
    "flet-desktop==0.86.5",
    "pillow>=12.2.0",
    "pyinstaller>=6.20.0",
    "pytest>=8.0",
]

[tool.flet]
company = "godsfear"
copyright = "Copyright (c) 2026 godsfear"

[tool.flet.app]
# Окно стартует скрытым (нативный раннер не показывает его сразу) — показываем
# из main() после построения UI, поэтому никакой вспышки на старте.
hide_window_on_start = true

# Не код / рантайм-мусор — не пакуем в сборку.
# ВНИМАНИЕ: locale/ и config/ НЕ исключать — это нужные данные/код приложения.
# tools/ — бинарники (ffmpeg/yt-dlp), приложение качает их при первом запуске.
exclude = [
    ".claude",
    ".git",
    ".gitignore",
    ".idea",
    ".pytest_cache",
    ".venv",
    "venv",
    "graphify-out",
    "Releases",
    "tests",
    "images",
    "tools",
    "config.json",
    "savemedia.db",
    "savemedia.log",
    "uv.lock",
    "readme.md",
    "__pycache__",
    "**/__pycache__",
	"Releases"
]
